services:
  mapban:
    build: .
    container_name: spectra-mapban
    restart: unless-stopped
    ports:
      - "5300:5300"
    environment:
      CONFIG_DIR: /app/config
      DATA_DIR: /data
      PORT: 5300
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5300/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
